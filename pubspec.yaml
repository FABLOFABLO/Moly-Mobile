name: moly_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/svg/
    - assets/png/

  fonts:
    - family: SpoqaHanSansNeo
      fonts:
        - asset: assets/font/SpoqaHanSansNeo-Thin.ttf
          weight: 100
        - asset: assets/font/SpoqaHanSansNeo-Light.ttf
          weight: 300
        - asset: assets/font/SpoqaHanSansNeo-Regular.ttf
          weight: 400
        - asset: assets/font/SpoqaHanSansNeo-Medium.ttf
          weight: 500
        - asset: assets/font/SpoqaHanSansNeo-Bold.ttf
          weight: 700
